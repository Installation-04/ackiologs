# Every historized point. `connection` must match a name in connections.yaml.
# `address` format depends on protocol — see README "Tag address formats".

tags:
  # --- Simulator tags (run out of the box, no external equipment needed) -----
  - name: Sim.Boiler.Temp
    connection: sim1
    address: "n/a"
    data_type: float
    engineering_units: degC
    description: Simulated boiler outlet temperature
    min_value: 0
    max_value: 120
    deadband_percent: 0.1
    sim: { kind: sine, offset: 70, amplitude: 15, period_s: 180, noise: 0.5 }
    alarms:
      - condition: high
        setpoint: 90
        priority: 3
        message: "Boiler temperature high"
      - condition: high_high
        setpoint: 105
        priority: 1
        message: "Boiler temperature HIGH-HIGH — shutdown imminent"

  - name: Sim.Tank1.Level
    connection: sim1
    address: "n/a"
    data_type: float
    engineering_units: "%"
    min_value: 0
    max_value: 100
    sim: { kind: random_walk, offset: 55, step: 0.8 }
    alarms:
      - condition: low
        setpoint: 10
        priority: 2
        message: "Tank 1 level low"

  - name: Sim.Line1.PartCount
    connection: sim1
    address: "n/a"
    data_type: int
    engineering_units: parts
    sim: { kind: counter, increment: 1 }

  - name: Sim.Pump1.Running
    connection: sim1
    address: "n/a"
    data_type: bool
    sim: { kind: bool_toggle, period_s: 45 }

  # --- OPC UA example (enable the matching connection in connections.yaml) ---

# Every connection Ackiologs polls or subscribes to. One entry per PLC/server/broker.
# `protocol` selects the driver in app/connectors/registry.py.
#
# This ships with only the built-in Simulator enabled so `docker compose up` produces
# live trending data with zero field equipment. Uncomment/add real connections as needed
# and re-run POST /api/config/reload (or restart the container) to pick them up.

connections:
  - name: sim1
    protocol: simulator
    poll_interval_ms: 1000

  # --- OPC UA example -------------------------------------------------------

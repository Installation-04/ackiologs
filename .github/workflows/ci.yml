name: CI

# Runs the test suite on every push and PR — unlike release.yml's `test` job, which
# only runs when a version tag is pushed. Two jobs: SQLite (the zero-config default)
# and a real Postgres service container, since dialect differences (e.g. Postgres
# returning decimal.Decimal from EXTRACT(epoch ...) where SQLite returns a float)
# have caused real bugs that SQLite-only testing didn't catch.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -e ".[dev]"
      - run: pytest -v

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ackiologs
          POSTGRES_PASSWORD: ackiologs
          POSTGRES_DB: ackiologs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ackiologs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACKIOLOGS_DATABASE_URL: postgresql+asyncpg://ackiologs:ackiologs@localhost:5432/ackiologs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -e ".[dev]"
      - run: pytest -v

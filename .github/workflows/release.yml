name: Release

# Fires on every version tag (v1.2.3) and builds all four release artifacts from
# that same commit: a Linux binary, a Windows portable exe + MSI installer, and a
# versioned Docker image — then attaches the first three to a GitHub Release and
# pushes the image to GHCR.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # A tag pushed by another workflow's GITHUB_TOKEN (auto-tag.yml) doesn't trigger
  # the `push: tags:` rule above — GitHub blocks a token-authored push from
  # cascading into other workflow runs, to prevent recursive chains. auto-tag.yml
  # works around that by explicitly dispatching this workflow via the API instead
  # (`gh workflow run release.yml --ref vX.Y.Z`); GITHUB_REF_NAME then resolves to
  # that tag the same way it would for a real `push: tags:` event, so `version`
  # below needs no special-casing. Also dispatchable by hand from the Actions tab
  # to rebuild/re-publish an existing tag's artifacts without re-tagging.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -e ".[dev]"
      - run: pytest -q

  build-linux:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python scripts/stamp_version.py "${{ needs.version.outputs.version }}"
      - name: Build onefile binary
        run: ONEFILE=1 pyinstaller --noconfirm --clean packaging/pyinstaller/ackiologs.spec
      - name: Package tarball
        run: |
          set -euo pipefail
          NAME="ackiologs-linux-x86_64-v${{ needs.version.outputs.version }}"
          mkdir -p "$NAME"
          cp dist/ackiologs "$NAME/"
          cp -r config "$NAME/"
          cp README.md "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: ackiologs-linux-x86_64-v${{ needs.version.outputs.version }}.tar.gz
          if-no-files-found: error

  build-windows:
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pywin32
      - name: Finish pywin32 install
        # pywin32's wheel doesn't register pywintypes/pythoncom on PATH by itself —
        # normally done by its post-install script, which needs to run once so
        # PyInstaller's pywin32 hooks can find those DLLs when freezing the service exe.
        shell: pwsh
        run: |
          $sitePackages = python -c "import site; print(site.getsitepackages()[0])"
          python "$sitePackages\pywin32_postinstall.py" -install
      - run: python scripts/stamp_version.py "${{ needs.version.outputs.version }}"
      - name: Build onedir bundle
        run: pyinstaller --noconfirm --clean packaging/pyinstaller/ackiologs.spec
      - name: Build background service exe
        # A separate exe (not just ackiologs.exe run differently) because it hosts the
        # app through pywin32's ServiceFramework instead of a plain console main() — see
        # packaging/pyinstaller/service_run.py. Placed alongside ackiologs.exe so the MSI
        # (built below) can register it as a Windows Service.
        run: |
          pyinstaller --noconfirm --clean packaging/pyinstaller/ackiologs_service.spec
          Copy-Item dist\ackiologs-service.exe dist\ackiologs\ackiologs-service.exe
        shell: pwsh
      - name: Package portable zip
        shell: pwsh
        run: |
          $name = "ackiologs-windows-x86_64-v${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item -Recurse dist\ackiologs\* $name\
          Copy-Item -Recurse config $name\config
          Copy-Item README.md $name\
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install WiX
        shell: pwsh
        run: |
          # Pinned to 6.0.1, the last release before WiX v7 started blocking every
          # command until its new Open Source Maintenance Fee EULA is accepted
          # (https://github.com/wixtoolset/issues/issues/9196) — v6 introduced the
          # fee but didn't enforce it at the CLI, so this avoids CI needing to deal
          # with EULA acceptance at all. Revisit the pin (and EULA acceptance) if a
          # future WiX v6.x feature/fix is needed.
          dotnet tool install -g wix --version 6.0.1
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build MSI
        shell: pwsh
        run: |
          wix extension add WixToolset.Util.wixext/6.0.1
          wix build packaging\windows\ackiologs.wxs `
            -ext WixToolset.Util.wixext `
            -d SourceDir=dist\ackiologs `
            -d ConfigDir=config `
            -d Version=${{ needs.version.outputs.version }} `
            -arch x64 `
            -o ackiologs-windows-x86_64-v${{ needs.version.outputs.version }}.msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            ackiologs-windows-x86_64-v${{ needs.version.outputs.version }}.zip
            ackiologs-windows-x86_64-v${{ needs.version.outputs.version }}.msi
          if-no-files-found: error

  build-docker:
    needs: [version, test]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/stamp_version.py "${{ needs.version.outputs.version }}"
      - id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest

  release:
    needs: [version, build-linux, build-windows, build-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Only the two artifacts this workflow explicitly uploads (build-linux's
          # "linux-release", build-windows's "windows-release") — without a pattern,
          # this also tries to fetch docker/build-push-action's own internal
          # "*.dockerbuild" provenance/cache artifact, which isn't meant to be
          # downloaded this way and fails unreliably (observed: 5 retries then a
          # hard failure, after both real artifacts had already downloaded fine).
          pattern: "*-release"
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Ackiologs v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            Docker image: `${{ needs.build-docker.outputs.image }}:${{ needs.version.outputs.version }}`

            ```
            docker pull ${{ needs.build-docker.outputs.image }}:${{ needs.version.outputs.version }}
            ```

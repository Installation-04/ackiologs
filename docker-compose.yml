# Zero-config deploy: `docker compose up -d` — SQLite storage, no external DB.
# For production time-series scale, layer on TimescaleDB instead:
#   docker compose -f docker-compose.yml -f docker-compose.timescale.yml up -d
services:
  historian:
    build: .
    image: ackiologs:latest
    ports:
      - "${ACKIOLOGS_PORT:-8000}:8000"
    environment:
      ACKIOLOGS_DATABASE_URL: "sqlite+aiosqlite:///./data/ackiologs.db"
      ACKIOLOGS_SECRET_KEY: "${ACKIOLOGS_SECRET_KEY:-change-me-in-production}"
      ACKIOLOGS_AUTH_ENABLED: "${ACKIOLOGS_AUTH_ENABLED:-true}"
    volumes:
      - ackiologs_data:/srv/ackiologs/data
      - ./config:/srv/ackiologs/config
    restart: unless-stopped

volumes:
  ackiologs_data:

# Overlay for production-scale storage. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.timescale.yml up -d
services:
  historian:
    environment:
      ACKIOLOGS_DATABASE_URL: "postgresql+asyncpg://ackiologs:${POSTGRES_PASSWORD:-ackiologs}@timescaledb:5432/ackiologs"
    depends_on:
      timescaledb:
        condition: service_healthy

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ackiologs
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ackiologs}"
      POSTGRES_DB: ackiologs
    volumes:
      - ackiologs_timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ackiologs"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  ackiologs_timescale_data:

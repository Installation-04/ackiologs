[project]
name = "ackiologs"
version = "1.1.1"
description = "Ackiologs — a protocol-agnostic industrial data historian: collect, store, and trend plant data from OPC UA, Modbus, MQTT, EtherNet/IP, Siemens S7, BACnet/IP, SNMP, HTTP/REST and SQL, with SQLite or TimescaleDB storage."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "asyncua>=1.1.5",
    # Pinned below 3.10: pymodbus 3.10+ deprecated ModbusSlaveContext's
    # getValues/setValues datastore API (the embedded Modbus server below writes
    # live values straight into the datastore) in favor of a new SimDevice/SimData
    # model that, as of this pin, has no equivalent for updating values at runtime
    # outside its own simulator app. Revisit this pin once that path stabilizes.
    "pymodbus>=3.6,<3.10",
    "paho-mqtt>=2.1",
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
    "orjson>=3.10",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pycomm3>=1.2.14",
    "python-snap7>=3.0",
    "bacpypes3>=0.0.100",
    "pysnmp>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
